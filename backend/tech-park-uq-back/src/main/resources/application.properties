#made with help of Gemini 

# 1. Puerto del Backend
server.port=8080

# 2. Configuración de H2 (Modo Archivo para que sea persistente)
# Esto creará una carpeta 'data' y un archivo 'techpark_db' en la raíz de testing-lab
spring.datasource.url=jdbc:h2:file:./data/techpark_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# 3. Consola Web (Para ver las tablas)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Esto permite que la consola se vea aunque uses herramientas como tmux/wezterm
spring.h2.console.settings.web-allow-others=true

# 4. JPA / Hibernate
# 'update' crea las tablas automáticamente basadas en tus clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
